name: Collect news preview images

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"   # 07:15 Dubai, after the daily news update
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tools/fetch_images.py"
      - ".github/workflows/fetch-images.yml"

permissions:
  contents: write

concurrency:
  group: news-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python tools/fetch_images.py
      - name: Commit image list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update news preview images"
          git pull --rebase origin main
          git push
